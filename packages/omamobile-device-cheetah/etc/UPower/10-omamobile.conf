# Installed as /etc/UPower/UPower.conf.d/10-omamobile.conf. upower's critical
# action on the Pixel 7 Pro: power off at 5 %, rather than sleep at 2 %
# (device/cheetah/SUSPEND-PLAN.md 6.6, stage B).
#
# upower's default (CriticalPowerAction=Auto) asks logind for Sleep(), and
# with hibernation off (our sleep.conf drop-in) that is a suspend. The gauge
# wakes the phone at the next 1 %, upower acts only when the warning level
# changes, and the phone runs flat with the root file system mounted
# (NOTES 2026-10-28). PowerOff unmounts it first.
#
# How upower 1.91 reads this file: after UPower.conf, files named
# NN-name.conf in UPower.conf.d are applied in name order, and a key here
# replaces the main file's value only if UPower.conf has that key (upower's
# default file has all of these). The percentages must fall strictly
# (Low > Critical > Action, each below 100), or upower ignores all three and
# uses 20/5/2. They are read as whole numbers: 7.5 would act as 7.
#
# 5 % is about 250 mAh. On 2026-10-28 the last 2 % lasted about 10 minutes
# awake, so this leaves about 25. The shell's omamobile-sleepd stays awake
# at 8 % and below on battery (OMAMOBILE_SLEEP_MIN_BATTERY), so the phone
# is awake when 5 % arrives. Local changes go in a later file, for example
# 99-local.conf.
[UPower]
UsePercentageForPolicy=true
PercentageLow=20.0
PercentageCritical=8.0
PercentageAction=5.0
CriticalPowerAction=PowerOff
