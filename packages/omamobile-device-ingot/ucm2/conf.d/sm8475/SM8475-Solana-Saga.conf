# Solana Mobile Saga (ingot, SM8475): card driver name "sm8475", long name
# "SM8475-Solana-Saga" (the sound node's model). Two WSA883x speaker
# amplifiers and a WCD938x codec on SoundWire, and two digital microphones
# (bottom and top), behind the LPASS macros and q6apm. The microphones record
# through the VA macro on a kernel whose device tree has the "VA Capture"
# link and clocks them at 2.4 MHz (omamobile-ingot-next baafc270e); on
# 2026-11-12 both heard a tone from the speakers, each louder from its own
# end. Without that link the profile has no Mic device (HiFi.conf).
Syntax 4

SectionUseCase."HiFi" {
	File "/Solana/ingot/HiFi.conf"
	Comment "Speaker, earpiece and microphones"
}

# The kernel has no speaker protection for these amplifiers, so the levels
# never go above the vendor's own for media on the speakers, which are the
# same with its speaker protection on or off:
# - each amplifier's analog gain at -3 dB, the vendor driver's fixed setting
#   (its register value 16; PA Volume 15 here, the control is inverted;
#   0-15 all read -3 dB, the hardware's lowest step);
# - the WSA macro's digital gain at -14 dB on RX0 (70; the top speaker,
#   also the earpiece: the vendor's value) and -3 dB on RX1 (81; the bottom
#   speaker: 3 dB under the vendor's 0 dB, and the kernel's own cap for
#   amplifiers without speaker protection);
# - the macro's compander off.
# The Speaker and Earpiece devices set the same values each time they are
# enabled (HiFi.conf), because alsactl restores a saved state over this
# sequence at boot. The profile names no playback mixer element, so the
# desktop's volume is software only and can only attenuate from here.
BootSequence [
	cset "name='SpkrLeft PA Volume' 15"
	cset "name='SpkrRight PA Volume' 15"
	cset "name='WSA_RX0 Digital Volume' 70"
	cset "name='WSA_RX1 Digital Volume' 81"
	cset "name='WSA_COMP1 Switch' 0"
	cset "name='WSA_COMP2 Switch' 0"
	cset "name='EAR SPKR PA Gain' G_DEFAULT"
	cset "name='SpkrLeft WSA MODE' Speaker"
	cset "name='SpkrRight WSA MODE' Speaker"
]

Include.card-init.File "/lib/card-init.conf"
