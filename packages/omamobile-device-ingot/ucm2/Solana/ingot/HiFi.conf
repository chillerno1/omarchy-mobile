# Solana Mobile Saga (ingot). MultiMedia2 (hw:CARD,1) plays through the WSA
# macro into the two WSA883x amplifiers; MultiMedia3 (hw:CARD,2) records the
# two digital microphones through the VA macro. A front end needs its back
# end mixer on before it can be opened: the verb sets the playback one, the
# Mic device the capture one.

SectionVerb {
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# Both amplifiers in stereo: the left channel to SpkrLeft, the right to
# SpkrRight. VISENSE stays off (nothing reads it).
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX0 INP1' ZERO"
		cset "name='WSA_RX1 INP0' RX1"
		cset "name='SpkrLeft WSA MODE' Speaker"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight WSA MODE' Speaker"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

# The amplifier at the ear alone, fed both channels mixed. The vendor's
# handset path is SpkrLeft through WSA RX0 and its speakerphone path
# SpkrRight, so SpkrLeft is the earpiece end; not yet confirmed by ear.
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX0 INP1' RX1"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrLeft WSA MODE' Speaker"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX0 INP1' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},1"
	}
}

# The built-in microphones are digital, on the LPASS DMIC lines: DMIC1 (the
# vendor's handset microphone) and DMIC6 (its speakerphone microphone),
# clocked and decimated by the VA macro. That needs the VA macro in the
# sound card (a "VA Capture" link and the DMIC pins in the device tree); on
# a kernel without it there is no Mic device at all. The WCD938x's analog
# inputs are not offered: none of them picked up a tone from the speakers.
If.dmic {
	Condition {
		Type ControlExists
		Control "name='VA DMIC MUX0'"
	}
	True {
		SectionDevice."Mic" {
			Comment "Internal microphones"

			EnableSequence [
				cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
				cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
				cset "name='VA DEC0 MUX' VA_DMIC"
				cset "name='VA DMIC MUX0' DMIC1"
				cset "name='VA_DEC0 Volume' 84"
				cset "name='VA_AIF1_CAP Mixer DEC0' 1"
				cset "name='VA DEC1 MUX' VA_DMIC"
				cset "name='VA DMIC MUX1' DMIC6"
				cset "name='VA_DEC1 Volume' 84"
				cset "name='VA_AIF1_CAP Mixer DEC1' 1"
			]

			DisableSequence [
				cset "name='VA_AIF1_CAP Mixer DEC0' 0"
				cset "name='VA_AIF1_CAP Mixer DEC1' 0"
				cset "name='VA DMIC MUX0' ZERO"
				cset "name='VA DMIC MUX1' ZERO"
				cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
			]

			Value {
				CaptureChannels 2
				CapturePriority 100
				CapturePCM "hw:${CardId},2"
			}
		}
	}
}
