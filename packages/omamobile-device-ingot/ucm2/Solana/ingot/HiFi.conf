# Solana Mobile Saga (ingot). MultiMedia2 (hw:CARD,1) plays through the WSA
# macro into the two WSA883x amplifiers; MultiMedia3 (hw:CARD,2) records the
# two digital microphones through the VA macro. A front end needs its back
# end mixer on before its PCM can be opened, and PipeWire's probe opens
# every device's PCM after setting the verb but before any device's
# EnableSequence. So the verb sets the back end mixers of both front ends,
# as the upstream Qualcomm profiles do; with the capture one only in the
# Mic device, the probe failed ("no backend DAIs enabled for MultiMedia3
# Capture") and the card offered only "off" and "pro-audio".
#
# The built-in microphones are digital, on the LPASS DMIC lines, clocked
# and decimated by the VA macro: DMIC1 is the microphone at the bottom of
# the phone (the vendor's handset microphone), DMIC6 the one at the top
# (its speakerphone microphone). The Mic device records DMIC1 on the left
# channel (0) and DMIC6 on the right (1). That needs the VA macro in the
# sound card: a device tree with a "VA Capture" link, the DMIC pins and the
# DMIC clock at 2.4 MHz (the vendor's recording rate; at 600 kHz, its
# low-power voice wake-up rate, every sample read zero). The clock is the
# kernel's device tree, not a control here. On a kernel without the VA
# macro its controls don't exist, so the verb sets only the playback back
# end and there is no Mic device at all. The WCD938x's analog inputs are
# not offered: none of them picked up a tone from the speakers.
#
# Capture gain: both VA decimators at 94, +10 dB (84 is 0 dB; there is no
# analog stage). At 0 dB, speech from arm's length read about -41 dBFS on
# the bottom microphone (peaks -15) over a room floor near -61; +10 dB puts
# it near -31 dBFS with peaks about -5, room for louder speech before
# clipping. The gain is digital: the floor rises with the speech (to about
# -51 dBFS, mostly 125-500 Hz room noise), the signal-to-noise ratio does
# not change. Both microphones get the same gain: a tone from both speakers
# read within 1-4 dB in each.
If.dmic {
	Condition {
		Type ControlExists
		Control "name='VA DMIC MUX0'"
	}
	True {
		SectionVerb {
			EnableSequence [
				cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
				cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
				cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
			]

			DisableSequence [
				cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
				cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
			]

			Value {
				TQ "HiFi"
			}
		}

		SectionDevice."Mic" {
			Comment "Internal microphones"

			EnableSequence [
				cset "name='VA DEC0 MUX' VA_DMIC"
				cset "name='VA DMIC MUX0' DMIC1"
				cset "name='VA_DEC0 Volume' 94"
				cset "name='VA_AIF1_CAP Mixer DEC0' 1"
				cset "name='VA DEC1 MUX' VA_DMIC"
				cset "name='VA DMIC MUX1' DMIC6"
				cset "name='VA_DEC1 Volume' 94"
				cset "name='VA_AIF1_CAP Mixer DEC1' 1"
			]

			DisableSequence [
				cset "name='VA_AIF1_CAP Mixer DEC0' 0"
				cset "name='VA_AIF1_CAP Mixer DEC1' 0"
				cset "name='VA DMIC MUX0' ZERO"
				cset "name='VA DMIC MUX1' ZERO"
			]

			Value {
				CaptureChannels 2
				CapturePriority 100
				CapturePCM "hw:${CardId},2"
			}
		}
	}
	False {
		SectionVerb {
			EnableSequence [
				cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
			]

			DisableSequence [
				cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
			]

			Value {
				TQ "HiFi"
			}
		}
	}
}

# Both amplifiers in stereo: the left channel to SpkrLeft (the top
# speaker), the right to SpkrRight (the bottom one). VISENSE stays off
# (nothing reads it). The gains are the vendor's own for media on the
# speakers, never more (see the card file): both amplifiers at -3 dB, the
# top speaker's digital gain at its -14 dB, the bottom one's at -3 dB, 3 dB
# under its 0 dB. Set here on every enable, so a restored mixer state can't
# leave them anywhere else. On 2026-11-12 this raised the bottom speaker by
# 11 dB (a 1 kHz tone, measured by the bottom microphone), with no new
# distortion; the top speaker kept its level.
SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='SpkrLeft PA Volume' 15"
		cset "name='SpkrRight PA Volume' 15"
		cset "name='WSA_RX0 Digital Volume' 70"
		cset "name='WSA_RX1 Digital Volume' 81"
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX0 INP1' ZERO"
		cset "name='WSA_RX1 INP0' RX1"
		cset "name='SpkrLeft WSA MODE' Speaker"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrRight WSA MODE' Speaker"
		cset "name='SpkrRight COMP Switch' 1"
		cset "name='SpkrRight BOOST Switch' 1"
		cset "name='SpkrRight VISENSE Switch' 0"
		cset "name='SpkrRight DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrRight COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrRight BOOST Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

# The amplifier at the ear alone, fed both channels mixed. The vendor's
# handset path is SpkrLeft through WSA RX0 and its speakerphone path
# SpkrRight, so SpkrLeft is the earpiece end (confirmed by ear 2026-11-12).
# Its gains are the vendor's handset ones: amplifier -3 dB, digital -14 dB.
SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='SpkrLeft PA Volume' 15"
		cset "name='WSA_RX0 Digital Volume' 70"
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX0 INP1' RX1"
		cset "name='WSA_RX1 INP0' ZERO"
		cset "name='SpkrRight DAC Switch' 0"
		cset "name='SpkrLeft WSA MODE' Speaker"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		cset "name='SpkrLeft DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA_RX0 INP1' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},1"
	}
}
