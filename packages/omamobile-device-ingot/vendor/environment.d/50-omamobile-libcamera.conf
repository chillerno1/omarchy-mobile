# SPDX-License-Identifier: MIT
# libcamera's software ISP debayers on the CPU on the Saga: its GPU debayer
# faults on the Adreno 730 (write translation faults, then IOMMU unmap
# warnings and a hang on close). Read by the user's systemd manager, so
# PipeWire's libcamera plugin (WirePlumber) and apps started in the session
# get it. environment.d can't unset a variable (an empty value is skipped),
# so to try the GPU path set an explicit LIBCAMERA_SOFTISP_MODE=gpu in
# ~/.config/environment.d/ instead of clearing this one.
LIBCAMERA_SOFTISP_MODE=cpu
