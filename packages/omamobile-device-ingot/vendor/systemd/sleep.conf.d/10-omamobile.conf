# The firmware advertises PSCI SYSTEM_SUSPEND, so the kernel offers "deep"
# sleep and makes it the default (/sys/power/mem_sleep reads "s2idle [deep]").
# Deep sleep is untested on the Saga; suspend-to-idle is what the suspend
# tests passed with (RTC wake, Wi-Fi and Bluetooth back afterwards), so
# suspend means suspend-to-idle until deep sleep has been shown to wake.
# There is no swap to hibernate to. Same settings as the Pixel packages.
[Sleep]
MemorySleepMode=s2idle
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
