# Wi-Fi: the WCN6855 hw2.1 (QCA6490) on PCIe0 through ath11k, running the
# phone's own mobile firmware (omamobile-ingot-firmware installs it). That
# firmware needs three debug options of the ingot kernel (branch
# omamobile-ingot, "DEBUG: wifi: ath11k: ..." commits, not for merging).
# On a kernel without them the module logs "unknown parameter" and ignores
# them, so this file is harmless there.
#
# The vendor-style cold boot calibration: on the first "firmware init done"
# run the firmware in calibration mode, wait for the calibration to finish,
# then power cycle the chip before mission mode, as the stock driver does
# at every power-up. Without it the firmware crashes about 1.4 s after
# registering with mac80211. Costs about 6.6 s per boot, as on stock.
options ath11k dbg_wcn_cbc=1
# Never send WMM parameters: the firmware's WMI_VDEV_SET_WMM_PARAMS handler
# dereferences per-radio state that is missing on this chip and crashes,
# before and after the vdev starts (so dbg_defer_wmm is not enough).
# U-APSD is still configured; the firmware keeps its default WMM values.
options ath11k dbg_skip_wmm=1
# No P2P interfaces: creating the P2P device vdev makes the firmware assert
# (cmnos_thread.c line 559), so do not offer P2P device, client or GO.
options ath11k dbg_no_p2p=1
# The fourth need, MSIs on the PCIe controller's own MSI block instead of
# the GIC ITS, is a device tree change (no msi-map on pcie0), not a module
# option: nothing for this file.
