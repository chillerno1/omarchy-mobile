# The Saga's WCN6855 reports no permanent MAC address, so ath11k makes one
# up at every load. Give each Wi-Fi connection a stable generated address
# instead (derived by NetworkManager from its per-machine secret and the
# connection), so a network sees the same phone across boots and DHCP
# leases hold. Scans keep their random addresses.
[connection-omamobile-wifi-mac]
match-device=driver:ath11k_pci
wifi.cloned-mac-address=stable
