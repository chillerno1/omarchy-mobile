# SPDX-License-Identifier: MIT
# Device descriptor: Solana Mobile Saga (ingot, SM8475).
#
# tools/build-ingot-probe makes the boot, vendor_boot and dtbo images: ABL
# takes the device tree only from vendor_boot, so the generic image, flash,
# push and installer paths refuse this descriptor (BOOT_METHOD). The probe
# is booted with `fastboot boot`; vendor_boot and dtbo go to slot A, the
# experiment slot, with LineageOS on slot B as the way back.

# --- Identity ---
CODENAME=ingot
NAME="Solana Mobile Saga"
USB_PRODUCT="Solana Mobile Saga"
SOC=sm8475
COMPATIBLE="osom,ingot"
# Storage guard and USB networking only (packages/omamobile-device-ingot)
PACKAGE=omamobile-device-ingot
BOOT_METHOD=ram-only
BOOT_IMAGES=""

# --- Storage guard ---
# Only userdata, the Arch root, may be written, and only by an image built
# with --arch. The RAM-only probe packs no allowlist: everything read-only.
UFS_RW="userdata"

# --- Initramfs ---
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2400
