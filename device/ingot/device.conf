# SPDX-License-Identifier: MIT
# RAM-only first light: tools/build-ingot-probe makes a header v2 boot image
# for `fastboot boot`, so nothing is written to the phone. The generic image,
# flash, push and installer paths refuse this descriptor. No writable storage.
CODENAME=ingot
NAME="Solana Mobile Saga"
SOC=sm8475
COMPATIBLE="osom,ingot"
BOOT_METHOD=ram-only
BOOT_IMAGES=""
UFS_RW=""
PANEL_SIZE=1080x2400
