# SPDX-License-Identifier: MIT
# Device descriptor: Solana Mobile Saga (ingot, SM8475).
#
# tools/build-ingot-probe makes the boot, vendor_boot and dtbo images, for a
# RAM probe, for booting Arch from userdata (--arch) and for a boot image
# flashed to boot_a (--standalone). ABL takes the device tree only from
# vendor_boot, so the generic image, flash, push and installer paths refuse
# this descriptor (BOOT_METHOD); the keys below that they don't know are
# read only by build-ingot-probe and tools/ingot-boot-footer. Slot A is ours
# on this phone, with LineageOS on slot B as the way back.

# --- Identity ---
CODENAME=ingot
NAME="Solana Mobile Saga"
USB_PRODUCT="Solana Mobile Saga"
SOC=sm8475
COMPATIBLE="osom,ingot"
# Storage guard and USB networking only (packages/omamobile-device-ingot)
PACKAGE=omamobile-device-ingot
BOOT_METHOD=ram-only
BOOT_IMAGES=""

# The slot Omarchy Mobile owns. Slot B holds LineageOS, the way back, so
# ours is A, the reverse of the Pixels; an --arch image packs it for the
# init's storage guard only with --self-update (below).
SLOT=a

# --- Storage guard ---
# Only userdata, the Arch root, may be written, and only by an image built
# with --arch. The RAM-only probe packs no allowlist: everything read-only.
UFS_RW="userdata"
# The wider allowlist only a --self-update image packs, so Arch on the
# phone can write its own boot images later: slot A's three images and
# userdata. The boot images sit on their own LUN (sde), which the guard then
# treats as it treats sda. The default image keeps userdata alone, so nothing
# it runs can write a boot partition.
UFS_RW_SELF_UPDATE="boot_a vendor_boot_a dtbo_a userdata"
UFS_RW_SELF_UPDATE_LUNS="sde"

# --- Standalone boot ---
# boot_a's size in bytes. ABL verifies boot with AVB when it boots from the
# slot, and where the slot's vbmeta chains boot, a boot partition with no
# footer leaves the phone in fastboot (any key passes while unlocked), so
# tools/ingot-boot-footer pads boot_a.img to this size with its footer at
# the end. Not AVB_FOOTERS: the generic loader ties that key to
# BOOT_IMAGES, which stays empty here.
BOOT_A_SIZE=0x6000000

# --- Initramfs ---
INITRAMFS_INIT=/initramfs/init
PANEL_SIZE=1080x2400

# --- Torch (omamobile-torch, the quick-settings tile) ---
# The rear flash LED: PM8350C's flash module, channels 1 and 2 ganged
# (leds-qcom-flash). In torch mode the current is brightness / 255 of the
# 200 mA total torch cap, so 128 is about 100 mA, the same as
# the Pixel 7 Pro's torch at its cap.
TORCH_LED=white:flash
TORCH_LEVEL=128
